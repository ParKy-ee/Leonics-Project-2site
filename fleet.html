<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leonics MOC Fleet Overview</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f5f5f0;
      --card: #fff;
      --panel: #fafaf7;
      --border: #e8e6df;
      --text: #1a1a1a;
      --sub: #888;
      --hint: #aaa;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #3b82f6;
      --purple: #8b5cf6;
      --orange: #ea580c;
      --load: #15803d;
      --radius: 12px;
      --font: 'DM Sans', system-ui, sans-serif;
      --mono: 'DM Mono', monospace;
      --bg-dark: #1a1a1a;
      --text-on-dark: #f5f5f0;
      --header-h: 54px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh
    }

    /* ---------- TOP HEADER ---------- */
    .app-header {
      min-height: var(--header-h);
      background: var(--bg-dark);
      color: var(--text-on-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: relative;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #fff;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-text {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .brand-text .sub {
      color: #888;
      font-weight: 400;
      margin-left: 6px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-nav {
      display: flex;
      gap: 4px;
    }

    .nav-btn {
      text-decoration: none;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .nav-btn:hover,
    .nav-btn.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .logout-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      color: #f5f5f0;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      transition: background .15s;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .logout-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Page */
    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 20px
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px
    }

    .subtitle {
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 20px
    }

    /* Site cards grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px
    }

    /* Site card */
    .site-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      cursor: pointer;
      transition: box-shadow .15s, border-color .15s;
      text-decoration: none;
      color: inherit;
      display: block
    }

    .site-card:hover {
      box-shadow: 0 2px 12px rgba(0, 0, 0, .06);
      border-color: #ccc
    }

    .site-card.offline {
      opacity: .55
    }

    .sc-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px
    }

    .sc-badge {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 10px;
      font-weight: 500
    }

    .sc-badge-offgrid {
      background: rgba(245, 158, 11, .1);
      color: var(--warning)
    }

    .sc-type {
      font-size: 11px;
      color: var(--sub)
    }

    .sc-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px
    }

    .sc-loc {
      font-size: 12px;
      color: var(--sub);
      margin-bottom: 12px
    }

    /* KPI row */
    .sc-kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px
    }

    .sc-kpi {
      background: var(--panel);
      border-radius: 6px;
      padding: 7px 9px
    }

    .sc-kpi .lbl {
      font-size: 10px;
      font-weight: 500;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: .3px
    }

    .sc-kpi .val {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 600;
      margin-top: 1px
    }

    .sc-kpi .val .u {
      font-size: 10px;
      color: var(--sub);
      margin-left: 1px
    }

    /* Status row */
    .sc-status {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .sc-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500
    }

    .sc-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%
    }

    .sc-dot-ok {
      background: var(--success)
    }

    .sc-dot-err {
      background: var(--danger)
    }

    .sc-time {
      font-size: 11px;
      color: var(--hint);
      font-family: var(--mono)
    }

    /* Responsive */
    @media(max-width:700px) {
      .grid {
        grid-template-columns: 1fr
      }

      .sc-kpis {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media (max-width: 768px) {
      .brand-text .sub {
        display: none;
      }
    }

    @media (max-width: 600px) {
      .app-header {
        flex-direction: column;
        align-items: stretch;
        padding: 12px 16px;
        gap: 12px;
        min-height: auto;
      }

      .app-header .brand {
        justify-content: flex-start;
      }

      .app-header .header-right {
        justify-content: space-between;
        width: 100%;
        gap: 12px;
      }

      .app-header .header-nav {
        flex: 1;
        gap: 8px;
      }

      .app-header .nav-btn {
        padding: 6px 12px;
        font-size: 12px;
        text-align: center;
      }

      .app-header .logout-btn {
        padding: 6px 12px;
        font-size: 11px;
      }
    }

    @media(max-width:480px) {
      .page {
        padding: 16px 12px
      }
    }
  </style>
</head>

<body>

  <header class="app-header">
    <div class="brand">
      <div class="brand-logo"><img src="Jambongan_S2/f1/image/leo.svg" alt="Leonics"></div>
      <div class="brand-text">
        Leonics MOC <span class="sub">Monitoring and Operation Center</span>
      </div>
    </div>

    <div class="header-right">
      <nav class="header-nav">
        <a href="fleet.html" class="nav-btn active">My sites</a>
        <a href="compare.html" class="nav-btn">Compare</a>
      </nav>
      <a href="logout.php" class="logout-btn" title="Logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        Logout
      </a>
    </div>
  </header>

  <div class="page">
    <h1>My sites</h1>
    <div class="subtitle">3 sites in Sabah, Malaysia. Two are live now and one slot is reserved for a future site.</div>
    <div class="grid" id="fleet"></div>
  </div>

  <script>
    const SITES = [
      { id: 1, name: 'Tetabuan', loc: 'Sabah, Malaysia', path: 'http://www.leonics-moc.com:52080/BELB_Sabah/Tetabuan_MYS/f1/', menuPath: 'menu.html', xmlPath: 'Xml/Main.xml', type: 'Off-Grid', mode: 'Solar+Bat+Gen' },
      { id: 2, name: 'Terusan', loc: 'Sabah, Malaysia', path: 'http://www.leonics-moc.com:52080/BELB_Sabah/Terusan_MYS/f1/', menuPath: 'menu.html', xmlPath: 'Xml/Main.xml', type: 'Hybrid', mode: 'Solar+Bat+Gen+Grid' },
    ];

    function num(xml, tag) {
      const el = xml.querySelector(tag);
      if (!el) return null;
      const t = el.textContent.trim();
      if (t === '' || t === 'err' || t === 'Err' || isNaN(parseFloat(t))) return null;
      return parseFloat(t);
    }
    function fmt(v, d = 1) { return v === null ? '—' : Number(v).toFixed(d); }

    function parseXmlDate(d, t) {
      if (!d || !t) return null;
      const p = d.split('-');
      if (p.length !== 3) return null;
      const day = parseInt(p[0]);
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const month = months.indexOf(p[1]);
      let year = parseInt(p[2]);
      if (year < 100) year += 2000;
      const tp = t.split(':');
      return new Date(year, month, day, parseInt(tp[0] || 0), parseInt(tp[1] || 0), parseInt(tp[2] || 0));
    }

    function buildCard(site, data) {
      if (site.planned) {
        return `<div class="site-card offline" aria-disabled="true">
      <div class="sc-top">
        <span class="sc-badge sc-badge-offgrid">${site.type}</span>
        <span class="sc-type">${site.mode}</span>
      </div>
      <div class="sc-name">${site.name}</div>
      <div class="sc-loc">${site.loc}</div>
      <div class="sc-kpis">
        <div class="sc-kpi"><div class="lbl">Solar</div><div class="val">—<span class="u">kW</span></div></div>
        <div class="sc-kpi"><div class="lbl">Gen</div><div class="val">—<span class="u">kW</span></div></div>
        <div class="sc-kpi"><div class="lbl">Load</div><div class="val">—<span class="u">kW</span></div></div>
        <div class="sc-kpi"><div class="lbl">SOC</div><div class="val">—<span class="u">%</span></div></div>
      </div>
      <div class="sc-status">
        <div class="sc-pill"><span class="sc-dot sc-dot-err"></span>Pending</div>
        <div class="sc-time">Path not assigned</div>
      </div>
    </div>`;
      }

      let online = data !== null;
      let timeStr = '—';

      if (online) {
        const ds = data.querySelector('DateServer');
        const ts = data.querySelector('TimeServer');
        if (ds && ts) {
          timeStr = ts.textContent.trim();
          const srvT = parseXmlDate(ds.textContent.trim(), ts.textContent.trim());
          const isOffline = srvT && Math.abs(new Date() - srvT) > 15 * 60 * 1000;
          if (isOffline) {
            online = false;
          }
        } else {
          online = false;
        }
      }

      let solar = null, gen = null, load = null;
      let soc = null;

      if (data !== null) {
        if (site.id === 1 || site.id === 2) { // Tetabuan and Terusan Logic
          const gci = num(data, 'GCI_Sum_AC_kW') || 0;
          const scc = (num(data, 'SCC1_Chg_Power_kW') || 0) + (num(data, 'SCC2_Chg_Power_kW') || 0);
          solar = num(data, 'PV_kW') !== null ? num(data, 'PV_kW') : (gci + scc);
          gen = (num(data, 'Gen1_Total_Power_kW') || 0) + (num(data, 'Gen2_Total_Power_kW') || 0);
          load = (num(data, 'Load_PM_Power_P1_kW') || 0) + (num(data, 'Load_PM_Power_P2_kW') || 0) + (num(data, 'Load_PM_Power_P3_kW') || 0);
          if (load === 0) {
            load = (num(data, 'BDI1_Load_Total_Power_kW') || 0) + (num(data, 'BDI2_Load_Total_Power_kW') || 0);
          }
          const soc1 = num(data, 'BDI1_BDI_SOC');
          const soc2 = num(data, 'BDI2_BDI_SOC');
          if (soc1 !== null && soc2 !== null) soc = (soc1 + soc2) / 2;
          else if (soc1 !== null) soc = soc1;
          else if (soc2 !== null) soc = soc2;
          else soc = 0;
        }
      }


      return `<a class="site-card ${online ? '' : 'offline'}" href="${site.path}${site.menuPath}" target="_top">
    <div class="sc-top">
      <span class="sc-badge sc-badge-offgrid">${site.type}</span>
      <span class="sc-type">${site.mode}</span>
    </div>
    <div class="sc-name">${site.name}</div>
    <div class="sc-loc">${site.loc}</div>
    <div class="sc-kpis">
      <div class="sc-kpi"><div class="lbl">Solar</div><div class="val" style="color:${solar > 0.5 ? '#f59e0b' : ''}">${fmt(solar)}<span class="u">kW</span></div></div>
      <div class="sc-kpi"><div class="lbl">Gen</div><div class="val" style="color:${gen > 0.5 ? '#ea580c' : ''}">${fmt(gen)}<span class="u">kW</span></div></div>
      <div class="sc-kpi"><div class="lbl">Load</div><div class="val" style="color:${load > 0.5 ? 'var(--load)' : ''}">${fmt(load)}<span class="u">kW</span></div></div>
      <div class="sc-kpi"><div class="lbl">SOC</div><div class="val" style="color:${soc !== null ? (soc < 20 ? '#ef4444' : soc < 50 ? '#f59e0b' : '#22c55e') : ''}">${soc !== null ? Math.round(soc) : '—'}<span class="u">%</span></div></div>
    </div>
    <div class="sc-status">
      <div class="sc-pill"><span class="sc-dot ${online ? 'sc-dot-ok' : 'sc-dot-err'}"></span>${online ? 'Online' : 'Offline'}</div>
      <div class="sc-time">${timeStr}</div>
    </div>
  </a>`;
    }

    async function fetchSite(site) {
      if (site.planned || !site.path || !site.xmlPath) return null;
      try {
        const url = site.path + site.xmlPath + '?_=' + Date.now();
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) return null;
        const text = await res.text();
        return new DOMParser().parseFromString(text, 'text/xml');
      } catch (e) {
        return null;
      }
    }

    async function refresh() {
      const results = await Promise.all(SITES.map(s => fetchSite(s)));
      let html = '';
      SITES.forEach((site, i) => {
        html += buildCard(site, results[i]);
      });
      document.getElementById('fleet').innerHTML = html;
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>

</html>
